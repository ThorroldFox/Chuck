name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. Backend Verification (.NET 10 LTS)
  backend:
    name: Backend (.NET 10 LTS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore API/Chuck.slnx

      - name: Build & Run Tests
        run: dotnet test API/Chuck.slnx --configuration Release --verbosity normal

  # 2. Frontend Verification (React 19 / Vite / Vitest)
  frontend:
    name: Frontend (React 19 / Vitest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: UI/Chuck.UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: UI/Chuck.UI/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

  # 3. Full-Stack Single-Container Build, GHCR & Release Publishing
  docker:
    name: Container Build & Publish
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: meta
        run: |
          VERSION=$(node -p "require('./UI/Chuck.UI/package.json').version")
          IMAGE_LC=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_LC}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t chuck:latest \
            -t chuck:${{ steps.meta.outputs.version }} \
            -t ${{ steps.meta.outputs.image }}:latest \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} \
            .

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.meta.outputs.image }}:latest
          docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      - name: Check if GitHub Release Exists
        id: check_release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.meta.outputs.version }} already exists. Skipping release creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release ${{ steps.meta.outputs.version }} does not exist yet. Preparing new release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Attach Offline Archive
        if: github.event_name != 'pull_request' && steps.check_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.meta.outputs.version }}
          IMAGE_NAME: ${{ steps.meta.outputs.image }}
        run: |
          TAR_FILE="chuck-${VERSION_TAG}.tar"
          docker save -o "${TAR_FILE}" \
            "${IMAGE_NAME}:${VERSION_TAG}" \
            "${IMAGE_NAME}:latest" \
            "chuck:${VERSION_TAG}" \
            "chuck:latest"

          node -e '
            const fs = require("fs");
            const ver = process.env.VERSION_TAG;
            const img = process.env.IMAGE_NAME;
            let title = `Chuck ${ver}`;
            let notes = `Release ${ver} of Chuck.`;

            if (fs.existsSync("CHANGELOG.md")) {
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
              const prefix = `## [${ver}] - `;
              const startIdx = lines.findIndex(l => l.startsWith(prefix));
              if (startIdx !== -1) {
                const codename = lines[startIdx].slice(prefix.length).replace(/\s*\([^)]+\)\s*$/, "").trim();
                if (codename) title = `Chuck ${ver} – ${codename}`;
                const sectionLines = [];
                for (let i = startIdx + 1; i < lines.length; i++) {
                  if (lines[i].startsWith("## [")) break;
                  sectionLines.push(lines[i]);
                }
                const extracted = sectionLines.join("\n").trim();
                if (extracted) notes = extracted;
              }
            }

            const body = [
              "### 🚀 What\x27s New",
              "",
              notes,
              "",
              "---",
              "",
              "### 📦 Deployment Options",
              "",
              "#### Option 1: GitHub Container Registry (Recommended)",
              "Download `docker-compose.yml` and run:",
              "```bash",
              "docker compose up -d",
              "```",
              `Or pull the version-pinned image directly: \`docker pull ${img}:${ver}\``,
              "",
              "#### Option 2: Standalone Offline Archive (\`.tar\`)",
              `Download \`chuck-${ver}.tar\` and \`docker-compose.yml\` from the assets below, then run:`,
              "```bash",
              `docker load -i chuck-${ver}.tar`,
              "docker compose up -d",
              "```"
            ].join("\n") + "\n";

            fs.writeFileSync("release_notes.md", body, "utf8");
            fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TITLE=${title}\n`);
          '

          gh release create "${VERSION_TAG}" \
            "${TAR_FILE}" \
            "docker-compose.yml" \
            --title "${RELEASE_TITLE}" \
            --notes-file release_notes.md
