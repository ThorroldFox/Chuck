name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Verification (.NET 10 LTS)
  backend:
    name: Backend (.NET 10 LTS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore API/Chuck.slnx

      - name: Build & Run Tests
        run: dotnet test API/Chuck.slnx --configuration Release --verbosity normal

  # 2. Frontend Verification (React 19 / Vite / Vitest)
  frontend:
    name: Frontend (React 19 / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI/Chuck.UI
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: UI/Chuck.UI/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test

      - name: Build Production Bundle
        run: npm run build

  # 3. Full-Stack Single-Container Build Verification
  docker:
    name: Container Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t chuck:latest .
