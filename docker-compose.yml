services:
  chuck:
    image: ghcr.io/thorroldfox/chuck:latest
    container_name: chuck
    ports:
      - "8080:8080"
    volumes:
      # Maps a local folder to the container. 
      # The right side MUST match ChuckSettings__DiskStoragePath!
      - ./data/drops:/app/data/drops
    environment:
      # Forces .NET into Production mode
      - ASPNETCORE_ENVIRONMENT=Production
      
      # ==========================================
      # CHUCK SETTINGS OVERRIDES
      # ==========================================
      
      # The absolute maximum size of a single drop (in bytes). 
      # 524288000 = 500MB, 1073741824 = 1GB
      - ChuckSettings__MaxPayloadSizeBytes=524288000
      
      # Where Chuck writes the temporary files inside the container.
      - ChuckSettings__DiskStoragePath=/app/data/drops
      
      # Virus scanning via ClamAV container (set to false to disable)
      - ChuckSettings__EnableVirusScanning=true
      - ChuckSettings__ClamAvHost=clamav
      - ChuckSettings__ClamAvPort=3310
      
      # Optional: Restrict instance access with one or more passcodes (comma-separated).
      # When set, the UI locks and prompts for a passcode before allowing drops or catches.
      # - ChuckSettings__InstancePasscodes=SecretKey123,FamilyKey456
      
      # Storage safety: uploads are rejected (HTTP 507) if they would leave less than this much
      # free space (in bytes) on the drops volume. Default 1073741824 = 1GB. Set to 0 to disable.
      # - ChuckSettings__MinFreeDiskSpaceBytes=1073741824
      
      # Optional: Only allow these client IPs / CIDR subnets (comma-separated) to use Chuck.
      # Everyone else sees an "Access Restricted" screen. Loopback is NOT exempt, and an invalid
      # entry stops Chuck from starting.
      # - ChuckSettings__AllowedNetworks=192.168.1.0/24,100.64.0.0/10
      
      # Optional: Extra reverse proxies (IPs / CIDR subnets, comma-separated) whose X-Forwarded-For
      # header is trusted. Loopback and private ranges (10/8, 172.16/12, 192.168/16, fc00::/7) are
      # always trusted, so you only need this for proxies on public addresses.
      # - ChuckSettings__TrustedProxies=203.0.113.10      
      # --- Advanced RAM Tuning ---
      # Uncomment to override these default thresholds.
      # - ChuckSettings__RamThresholdBytes=51200
      # - ChuckSettings__MaxRamCacheSizeBytes=104857600
      
    depends_on:
      - clamav
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: chuck-clamav
    restart: unless-stopped
    volumes:
      # ClamAV needs read access to the exact same drop path for zero-copy file scanning
      - ./data/drops:/app/data/drops:ro
      # Persist virus database definitions between restarts
      - clamav-db:/var/lib/clamav

volumes:
  clamav-db:
